name: hand_view
# 手のリグの調査・確認用(チェイスのシーンとは無関係)。 gh workflow run hand_view.yml -f script=tools/hand_view.py
on:
  workflow_dispatch:
    inputs:
      script:
        default: "tools/hand_view.py"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: bl
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-5.0.1-linux-x64
      - name: Download Blender
        if: steps.bl.outputs.cache-hit != 'true'
        run: |
          curl -sL -o blender.tar.xz "https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
          tar -xf blender.tar.xz && mv blender-5.0.1-linux-x64 blender && rm blender.tar.xz
      - name: Run
        run: |
          blender/blender --background --factory-startup --python "${{ inputs.script }}" -- out > run.log 2>&1 || { tail -80 run.log; exit 1; }
          grep -vE "^(Blender|Read|Fra:|Warning|$)" run.log | tail -60
          cd out && zip -q ../png.zip *.png
      - name: Upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="h${{ github.run_number }}"
          gh release create "$tag" --title "hand $tag" --notes "script=${{ inputs.script }}" --repo "${{ github.repository }}"
          gh release upload "$tag" png.zip run.log --clobber --repo "${{ github.repository }}"
